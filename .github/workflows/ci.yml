name: extension-contracts
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run bundle
        env:
          MANKO_SOURCE_REVISION: main
      - run: npm run docs:check
      - run: npm run docs:build
      - run: npm run publish:dry-run
      - name: Verify generated outputs are committed
        run: node packages/cli/lib/verify-generated.mjs
