[workspace]
resolver = "2"
members = [
  "extensions/content/MangaFire",
  "extensions/content/Komga",
  "packages/sdk",
  "packages/site-support",
  "extensions/content/HitomiLA",
  "extensions/content/LNori",
  "extensions/content/MangaFox",
  "extensions/content/NHentai",
  "extensions/content/OmegaScans",
  "extensions/tracker/AniList",
  "extensions/tracker/MyAnimeList",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
manko-site-support = { path = "packages/site-support" }
manko-sdk = { path = "packages/sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
url = "2.5"
regex = "1.11"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
